<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | My Interview</title>
  <meta name="description" content="Open My Interview to create a new password." />
  <style>
    :root {
      --navy: #1C3A6B;
      --ink: #111827;
      --muted: #687386;
      --line: #E5EAF2;
      --soft: #F3F6FA;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--soft);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .card {
      width: min(100%, 460px);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 18px 48px rgba(28, 58, 107, 0.14);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: block;
    }

    .brand {
      color: var(--navy);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.28em;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      width: 100%;
      border-radius: 999px;
      border: 0;
      background: var(--navy);
      color: var(--white);
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .small {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/InterviewApp/docs/assets/icon.png" alt="My Interview" />
    <div class="brand">MY INTERVIEW</div>
    <h1>Create your new password</h1>
    <p>We are opening the My Interview app so you can securely set a new password.</p>
    <a id="openApp" class="button" href="#">Open My Interview</a>
    <p class="small">If nothing happens, make sure My Interview is installed, then tap the button again.</p>
  </main>

  <script>
    const getParams = () => {
      const params = new URLSearchParams(window.location.search);
      if (!params.toString() && window.location.hash) {
        return new URLSearchParams(window.location.hash.replace(/^#/, ""));
      }
      return params;
    };

    const params = getParams();
    const tokenHash = params.get("token_hash") || params.get("tokenHash") || "";
    const accessToken = params.get("access_token") || "";
    const refreshToken = params.get("refresh_token") || "";
    const token = params.get("token") || "";
    const email = params.get("email") || "";
    const code = params.get("code") || "";
    const type = params.get("type") || "recovery";

    const appParams = new URLSearchParams();
    if (tokenHash) appParams.set("token_hash", tokenHash);
    if (accessToken) appParams.set("access_token", accessToken);
    if (refreshToken) appParams.set("refresh_token", refreshToken);
    if (token) appParams.set("token", token);
    if (email) appParams.set("email", email);
    if (code) appParams.set("code", code);
    appParams.set("type", type);

    const deepLink = `interviewapp://reset-password?${appParams.toString()}`;
    const button = document.getElementById("openApp");
    button.href = deepLink;

    window.setTimeout(() => {
      window.location.href = deepLink;
    }, 250);
  </script>
</body>
</html>
